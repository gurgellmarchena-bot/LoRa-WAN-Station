; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino

monitor_speed = 115200
upload_speed = 921600
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library@5.0.1
    m5stack/M5Unit-ENV@^1.3.0
    m5stack/M5Unified@^0.1.9
    m5stack/M5GFX@^0.1.15
build_flags =
    -D LMIC_USE_INTERRUPTS
    -D LMIC_DEBUG_LEVEL=2
    -D ARDUINO_LMIC_PROJECT_CONFIG_H__
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    -D HAL_NO_WAIT_BOSS=1